name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Pinned to a commit: a tag can be moved to different code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # swift-format output and compiler warnings change between Xcode releases, so use the newest
      # Xcode on the image (closest to what the code is developed with).
      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app \
            | sed -E 's|^(.*/Xcode_([0-9.]+)[^/]*\.app)$|\2 \1|' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2-)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      # Since Xcode 26 the Metal compiler is a separate download.
      - name: Install Metal toolchain
        run: |
          xcrun -f metal 2>/dev/null || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      # Pinned, so a new release cannot turn CI red on a commit that changed nothing. Keep them in
      # step with the versions used locally (`swiftlint version`, `clang-format --version`); the
      # SwiftLint checksum is the release asset's sha256 from GitHub.
      - name: Install SwiftLint and clang-format
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
          CLANG_FORMAT_VERSION: 23.1.5
        run: |
          zip="$RUNNER_TEMP/swiftlint.zip"
          curl -fsSL -o "$zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          pipx install "clang-format==$CLANG_FORMAT_VERSION"
          bin=$(pipx environment --value PIPX_BIN_DIR)
          echo "$bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
          "$bin/clang-format" --version

      # Ask Metal, not system_profiler: the runner's paravirtual GPU is invisible to the latter.
      - name: GPU
        run: |
          gpu=$(swift scripts/ci/metal-device.swift)
          echo "$gpu"
          printf '### GPU\n\n%s\n\n' "$gpu" >> "$GITHUB_STEP_SUMMARY"
          # Annotations, unlike logs and summaries, are visible without signing in.
          echo "::notice title=GPU::$gpu"

      # Format check, SwiftLint, Metal -Weverything -Werror, warnings-as-errors build.
      - name: Lint
        run: scripts/lint.sh

      # No puzzle inputs in CI (they are not redistributable): the real-input tests skip, the
      # example tests run. GPU suites skip if the runner has no Metal device.
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      # Swift Testing prints "✔ Test run with …" at the end and "➜ … skipped: "reason"" for every
      # skipped test or suite (e.g. GPU suites on a runner without Metal, real-input tests).
      - name: Test summary
        if: always()
        run: |
          {
            echo "### Tests"
            grep -E '^(✔|✘) Test run' test.log || echo "No test run result found (build failure?)"
            echo
            if grep -q 'skipped:' test.log; then
              echo "Skipped:"
              grep 'skipped:' test.log | sed -E 's/^➜ /- /'
            else
              echo "Nothing skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          result=$(grep -E '^(✔|✘) Test run' test.log | sed -E 's/^(✔|✘) //' || true)
          echo "::notice title=Tests::${result:-no test run result found}"
          grep 'skipped:' test.log | sed -E 's/^➜ //; s/^/::notice title=Skipped::/' || true

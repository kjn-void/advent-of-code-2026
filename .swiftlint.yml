# SwiftLint: the "cargo clippy" of Swift — best-practice and correctness lints on top of
# swift-format's style rules. Formatting/whitespace rules that swift-format owns are disabled
# so the two tools never fight. Run with `make lint` (fails on any violation via --strict).
included:
  - Sources
  - Tests
  - Plugins
  - Package.swift
excluded:
  - .build
  - templates

disabled_rules:
  # Owned by swift-format.
  - trailing_comma
  - opening_brace
  - closure_parameter_position
  - vertical_parameter_alignment
  - line_length
  - comma
  - colon
  - statement_position
  # AoC code: short math-y names (x, y, i, n, dx) are the clearest option.
  - identifier_name
  # Too noisy for puzzle code; keep `type_body_length` / `function_body_length` below instead.
  - cyclomatic_complexity
  - nesting
  - todo

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - redundant_nil_coalescing
  - redundant_type_annotation
  - reduce_into
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

analyzer_rules:  # `swiftlint analyze` (needs a compiler log); see scripts/lint.sh
  - unused_declaration
  - unused_import

force_try: error
implicit_return:
  included: [closure, getter]
function_body_length:
  warning: 80
  error: 150
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 800
  error: 1200
large_tuple:
  warning: 4
reporter: xcode
